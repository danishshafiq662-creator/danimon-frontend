const playFallback = () => {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const beep = (freq, start, dur) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur);
    };
    beep(880, 0, 0.15);
    beep(1320, 0.15, 0.22);
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 800);
  } catch (e) {}
};

    <${Footer} t=${t} go=${k => { if (user) { setScreen("app"); setNav(k); } else go("login"); window.scrollTo(0, 0); }} />
    ${inApp && html`<nav className=${"glass fixed inset-x-0 bottom-0 z-40 mx-auto grid max-w-md border-t border-white/40 pb-[env(safe-area-inset-bottom)] " + (adm || (user && user.role === "chef") ? "grid-cols-6" : "grid-cols-5")}>${NAV.map(([k, ic]) => html`<button key=${k} onClick=${() => { setNav(k); window.scrollTo(0, 0); }} className=${"relative flex flex-col items-center gap-0.5 py-2.5 text-[11px] font-semibold " + (nav === k ? "text-danimon-blue" : "text-slate-400")}><i className=${"fa-solid text-lg " + ic}></i>${t(k)}${k === "cart" && count > 0 && html`<span key=${pulse} className="absolute right-5 top-1 rounded-full bg-danimon-blue px-1.5 text-[10px] text-white" style=${{ animation: "badgePulse .5s" }}>${count}</span>`}</button>`)}</nav>`}
    ${modal && html`<div className="fixed inset-0 z-[70] overflow-y-auto bg-danimon-navy/70 p-4"><div className="mx-auto mt-16 max-w-sm rounded-3xl bg-white pb-4 shadow-2xl"><${Login} t=${t} admin=${true} onDone=${signedIn} back=${() => setModal(false)} /></div></div>`}
    ${locModal && html`<div className="fixed inset-0 z-[65] bg-danimon-navy/60 p-4" onClick=${() => setLocModal(false)}><div className="mx-auto mt-24 max-w-sm space-y-2 rounded-3xl bg-white p-4 shadow-2xl" onClick=${e => e.stopPropagation()}><${Btn} onClick=${() => navigator.geolocation ? navigator.geolocation.getCurrentPosition(async g => { setLoc(await geoName(g.coords.latitude, g.coords.longitude)); setLocModal(false); }, () => notify(t("noGeo")), { timeout: 6000 }) : notify(t("noGeo"))}>📍 ${t("gps")}<//><input list="areas-list-modal" value=${loc} onChange=${e => setLoc(e.target.value)} placeholder=${t("chooseArea") + "…"} className="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-3 text-sm outline-none focus:border-danimon-blue" />
<datalist id="areas-list-modal">${AREAS.map(a => html`<option key=${a} value=${a} />`)}</datalist>
<button onClick=${() => setLocModal(false)} className="btn w-full rounded-xl bg-danimon-blue py-2.5 text-sm font-bold text-white">✓ ${t("save")}</button>
    <${Splash} /><${Toast} n=${notif} onClose=${() => setNotif(null)} />
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
